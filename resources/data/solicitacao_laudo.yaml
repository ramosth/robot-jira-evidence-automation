# API VeriCar - Estrutura de Dados
# VeriCar [Solicita]

########## CONTEXTO PARA USO DO ENDPOINT ##########

# Requisição com Campos Obrigatórios
requisicao_campos_obrigatorios:
  numeroProposta: string # Chave de identificação única (máx 30 caracteres)
  tipoCliente: number # 1-PF, 2-PJ
  nomeCliente: string # Nome do cliente (máx 100 caracteres)
  documentoCliente: string # CPF/CNPJ sem formatação (máx 14 caracteres)
  cnpjLoja: string # CNPJ sem formatação (máx 14 caracteres)
  nomeVendedor: string # Nome do vendedor (máx 100 caracteres)
  placa: string # Placa do veículo (máx 7 caracteres)
  renavam: number # Número do RENAVAM (máx 12 dígitos)
  ufPlaca: string # UF da placa (2 caracteres)
  cidade: string # Cidade da loja (máx 40 caracteres)

# Requisição Completa com Todos os Campos
requisicao_completa:
  # Campos obrigatórios
  numeroProposta: string # Chave de identificação única (máx 30 caracteres)
  tipoCliente: number # 1-PF, 2-PJ
  nomeCliente: string # Nome do cliente (máx 100 caracteres)
  documentoCliente: string # CPF/CNPJ sem formatação (máx 14 caracteres)
  cnpjLoja: string # CNPJ sem formatação (máx 14 caracteres)
  nomeVendedor: string # Nome do vendedor (máx 100 caracteres)
  placa: string # Placa do veículo (máx 7 caracteres)
  renavam: number # Número do RENAVAM (máx 12 dígitos)
  ufPlaca: string # UF da placa (2 caracteres)
  cidade: string # Cidade da loja (máx 40 caracteres)

  # Campos opcionais
  filial: string # Identificação da filial solicitante (máx 30 caracteres)
  cpfVendedor: string # CPF do vendedor sem formatação (máx 11 caracteres)
  quilometragem: number # Quilometragem do veículo (máx 7 dígitos)
  consultarbaseLeiloes: boolean # Default: true

  # Campos complexos
  imagensVeiculo:
    - tipo: number # 1-Frontal, 2-Lateral Direita, 3-Lateral Esquerda, 4-Odômetro, 5-Placa, 6-Traseira
      imagem: string # Imagem em Base64

  itensSeguranca:
    - number # Array de números representando os itens
    # Domínio: 1-Airbag, 2-Buzina, 3-Cabo de bateria, 4-Chave de roda, 5-Cintos de segurança,
    # 6-Compressor, 7-Encosto de cabeça, 8-Espelhos, 9-Extintor na validade, 10-Freio ABS,
    # 11-Freio de estacionamento, 12-Lanterna, 13-Limpador de para-brisas, 14-Luzes indicadoras,
    # 15-Macaco, 16-Manual do Veículo, 17-Triângulo de sinalização

  condicoesVeiculo:
    - tipo: number # 1-Elétrica, 2-Lataria, 3-Mecânica, 4-Pintura, 5-Pneus, 6-Tapeçaria
      condicao: number # Varia conforme o tipo (ver documentação)
      observacoes: string # Observações sobre o item (máx 200 caracteres)

# Resposta de SUCESSO
resposta_sucesso:
  controle:
    - codigo: 0
      descricao: string
  idLaudo: string
  laudo: string # PDF em formato Base64

# Exemplo concreto de Resposta de Sucesso
exemplo_resposta_sucesso:
  controle:
    - codigo: 0
      descricao: "Laudo solicitado com sucesso"
  idLaudo: "9876543210"
  laudo: "JVBERi0xLjQKJcfs..."

# Resposta de ERRO
resposta_erro:
  controle:
    - codigo: number # Códigos diferentes de 0 indicam erro
      descricao: string
  idLaudo: null
  laudo: null

# Exemplo concreto de Resposta de Erro
exemplo_resposta_erro:
  controle:
    - codigo: 10
      descricao: "Documento do cliente inválido pelo dígito verificador."
  idLaudo: null
  laudo: null

####################################################################
# -----------------------------------------------------------------------------
# TEXTOS
# -----------------------------------------------------------------------------
vericar_texto:
  solicitar_laudo:
    etapa_1:
      titulo: Dados do laudo
      descricao: Insira as informações básicas.
    etapa_2:
      titulo: Itens
      descricao: Assinale os equipamentos desejados.
    etapa_3:
      titulo: Imagens para análise
      descricao: Anexe documentos e imagens.
    etapa_4:
      titulo: Revise sua solicitação
      descricao: Após confirmação, o laudo será solicitado.

# -----------------------------------------------------------------------------
# MODAIS
# -----------------------------------------------------------------------------
vericar_modal:
  solicitar_laudo:
    titulo: Solicitação de novo laudo
    titulo_etapa_1: Dados
    titulo_etapa_2: Itens
    titulo_etapa_3: Anexos
    titulo_etapa_4: Resumo
  emissao_em_processamento:
    botao_1: Voltar para lista de laudos
    conteudo_1: Seu laudo será gerado e deve ficar pronto em alguns minutos. Você pode continuar navegando ou retornar à lista mais tarde para visualizar ou fazer o download.
    titulo: Emissão em processamento!
  emissao_erro:
    botao_1: Voltar para a lista de laudos
    botao_2: Tentar emitir novamente
    conteudo_1: Ocorreu um erro ao processar a emissão do Laudo Veicular. Isso pode ter sido causado por uma inconsistência nos dados ou uma falha de comunicação com o sistema.
    conteudo_2: Por favor, verifique os dados inseridos (se necessário) e tente a emissão novamente. Se o problema persistir, entre em contato com o suporte.
    titulo: Não foi possível emitir o laudo.

